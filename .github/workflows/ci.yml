name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate synthetic dataset
        run: python app/data/generate_synthetic_data.py

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run retrieval evaluation (reports recall@k / MRR)
        run: python -m app.rag.eval

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: backend/app/data/eval_report.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx oxlint src/

      - name: Build
        run: npm run build
